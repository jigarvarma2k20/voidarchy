# Hyprland Keybindings Configuration File
# This file defines keybindings for various window management
# actions, application launches, media controls, and more.
# It uses ## to denote sections for better organization
# For shortcut descriptions, refer to the comments next to each binding.
# e.g., bind = MOD, KEY, ACTION, ARGUMENT # Description

# Global variables
$mainMod = SUPER
$TERMINAL = foot
$BROWSER  = brave
$EDITOR   = code
$FILEMAN  = dolphin

# Custom scripts
$LAUNCHER  = bash $XDG_CONFIG_HOME/rofi/launcher.sh
$LOGOUT    = bash $XDG_CONFIG_HOME/rofi/powermenu.sh
$CLIPBOARD = bash $XDG_CONFIG_HOME/rofi/clipboard.sh
$KEYBINDINGS= bash $XDG_CONFIG_HOME/rofi/keybindings.sh

# Begin keybindings

## Window management
bind = $mainMod, Q, killactive # Close active window
bind = ALT, F4, killactive # Force close window
bind = $mainMod, W, togglefloating # Toggle floating mode
bind = $mainMod, F, fullscreen # Toggle fullscreen
bind = $mainMod, J, togglesplit # Toggle split direction
bind = $mainMod, L, exec, hyprlock # Lock screen
bind = $mainMod, Delete, exit # Exit Hyprland session

## Window focus navigation
bind = $mainMod, Left,  movefocus, l # Focus window left
bind = $mainMod, Right, movefocus, r # Focus window right
bind = $mainMod, Up,    movefocus, u # Focus window up
bind = $mainMod, Down,  movefocus, d # Focus window down
bind = ALT, Tab, cyclenext # Cycle through windows

## Resize active window
binde = $mainMod SHIFT, Right, resizeactive, 30 0 # Resize window right
binde = $mainMod SHIFT, Left,  resizeactive, -30 0 # Resize window left
binde = $mainMod SHIFT, Up,    resizeactive, 0 -30 # Resize window up
binde = $mainMod SHIFT, Down,  resizeactive, 0 30 # Resize window down
bindm = $mainMod, mouse:272, movewindow # Move window with mouse
bindm = $mainMod, mouse:273, resizewindow # Resize window with mouse

## Application launchers
bind = $mainMod, T, exec, $TERMINAL # Open terminal
bind = $mainMod, B, exec, $BROWSER # Open browser
bind = $mainMod, E, exec, $FILEMAN # Open file manager
bind = $mainMod, C, exec, $EDITOR # Open code editor
bind = $mainMod, A, exec, $LAUNCHER # App launcher
bind = $mainMod, Tab, exec, rofi -show window # Window switcher

## Wallpaper
bind = $mainMod SHIFT, W, exec, waypaper --folder ~/Pictures/wallpapers # Change wallpaper
bind = $mainMod SHIFT, R, exec, waypaper --random --folder ~/Pictures/wallpapers # Random wallpaper

## Session & power
bind = CTRL ALT, Delete, exec, $LOGOUT # Logout / power menu

## Audio controls (PipeWire)
bindl  = , XF86AudioMute, exec, pamixer -t # Toggle audio mute
bindle = , XF86AudioLowerVolume, exec, pamixer -d 5 # Volume down
bindle = , XF86AudioRaiseVolume, exec, pamixer -i 5 # Volume up
bindl  = , XF86AudioMicMute, exec, pamixer --default-source -t # Toggle mic mute

## Media playback
bindl = , XF86AudioPlay, exec, playerctl play-pause # Play / pause media
bindl = , XF86AudioNext, exec, playerctl next # Next track
bindl = , XF86AudioPrev, exec, playerctl previous # Previous track

## Screen brightness
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +5% # Brightness up
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%- # Brightness down

## Clipboard
bind = $mainMod, V, exec, $CLIPBOARD # Open Clipboard

## Screenshots
bind = $mainMod, P, exec, grim -g "$(slurp)" - | wl-copy # Selective screenshot
bind = , Print, exec, grim - | wl-copy # Full screenshot

## Workspace switching
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace  2
bind = $mainMod, 3, workspace, 3 # Switch to workspace  3
bind = $mainMod, 4, workspace, 4 # Switch to workspace  4
bind = $mainMod, 5, workspace, 5 # Switch to workspace  5
bind = $mainMod, 6, workspace, 6 # Switch to workspace  6
bind = $mainMod, 7, workspace, 7 # Switch to workspace  7
bind = $mainMod, 8, workspace, 8 # Switch to workspace  8
bind = $mainMod, 9, workspace, 9 # Switch to workspace  9
bind = $mainMod, 0, workspace, 10 # Switch to workspace  10

bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move active window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move active window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move active window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move active window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move active window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move active window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move active window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move active window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move active window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move active window to workspace 10

## Workspace scrolling
bind = $mainMod, mouse_down, workspace, e+1 # Next workspace
bind = $mainMod, mouse_up,   workspace, e-1 # Previous workspace

## Scratchpad
bind = $mainMod, S, togglespecialworkspace # Toggle scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special # Send active window to scratchpad

## Keybindings help
bind = $mainMod, H, exec, $KEYBINDINGS # Show keybindings help