[Settings]
language = en
folder = ~/Pictures/wallpapers
wallpaper = $XDG_CONFIG_HOME/voidarchy/wall.jpg
monitors = All
show_path_in_tooltip = True
backend = awww
fill = fill
sort = name
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
post_command = $XDG_CONFIG_HOME/voidarchy/scripts/wallpaper.sh $wallpaper
number_of_columns = 3
awww_transition_type = any
awww_transition_step = 90
awww_transition_angle = 0
awww_transition_duration = 2
awww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
zen_mode = False
stylesheet = $XDG_CONFIG_HOME/waypaper/style.css
keybindings = $XDG_CONFIG_HOME/waypaper/keybindings.ini